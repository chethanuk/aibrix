# Prefill/Decode disaggregation with KV reuse via the AIBrixPDReuseConnector.
#
# This is the KV-centric P/D path: prefill and decode are separate vLLM engines that
# exchange the KV cache through a *shared L2 store* (SHFS, a shared file system) instead
# of a point-to-point RDMA transfer. It needs no RDMA NIC, so it runs on a single node
# (or any nodes that mount the same shared directory).
#
#   * Prefill engine: kv_role "kv_both"     (produces + can reuse KV)
#   * Decode  engine: kv_role "kv_consumer" (reads KV produced by prefill)
#   * Shared store:   AIBRIX_KV_CACHE_OL_L2_CACHE_BACKEND=SHFS, mounted at SHFS_ROOT
#
# See docs/source/features/kvcache-pd-reuse.rst for the full walkthrough.
apiVersion: orchestration.aibrix.ai/v1alpha1
kind: StormService
metadata:
  name: qwen3-32b-pd-reuse
  namespace: default
  labels:
    model.aibrix.ai/name: qwen3-32b
spec:
  replicas: 1
  updateStrategy:
    type: InPlaceUpdate
  stateful: true
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen3-32b-pd-reuse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-32b-pd-reuse
    spec:
      roles:
        # ---------------------------------------------------------------------
        # Prefill role — computes the prompt KV and writes it to the shared store.
        # ---------------------------------------------------------------------
        - name: prefill
          replicas: 1
          stateful: true
          template:
            metadata:
              labels:
                model.aibrix.ai/name: qwen3-32b
                model.aibrix.ai/port: "8000"
                model.aibrix.ai/engine: vllm
                role-name: prefill
                roleset-name: group-0
            spec:
              containers:
                - name: prefill
                  # Replace with a vLLM image built with the AIBrix KVCache connectors.
                  image: aibrix/vllm-openai:v0.10.2-aibrix-kvcache
                  command: ["sh", "-c"]
                  args:
                    - |
                      vllm serve \
                        --host "0.0.0.0" \
                        --port "8000" \
                        --model /models/Qwen3-32B \
                        --served-model-name qwen3-32b \
                        --trust-remote-code \
                        --swap-space "0" \
                        --no-enable-chunked-prefill \
                        --no-enable-prefix-caching \
                        --kv-transfer-config '{"kv_connector":"AIBrixPDReuseConnector","kv_role":"kv_both","engine_id":"prefill_'${ROLE_REPLICA_INDEX}'"}' \
                        --tensor-parallel-size=2
                  env:
                    - name: VLLM_USE_V1
                      value: "1"
                    # Disable L1 (DRAM) — KV is shared through the L2 store only.
                    - name: AIBRIX_KV_CACHE_OL_L1_CACHE_ENABLED
                      value: "0"
                    # Shared store: a shared file system, no RDMA required.
                    - name: AIBRIX_KV_CACHE_OL_L2_CACHE_BACKEND
                      value: "SHFS"
                    - name: AIBRIX_KV_CACHE_OL_SHFS_ROOT
                      value: "/kvcache"
                    - name: AIBRIX_KV_CACHE_OL_L2_CACHE_NAMESPACE
                      value: "aibrix"
                    - name: AIBRIX_KV_CACHE_OL_TOKEN_VALIDATION_ENABLED
                      value: "0"
                  volumeMounts:
                    - name: model-vol
                      mountPath: /models
                      readOnly: true
                    - name: shared-mem
                      mountPath: /dev/shm
                    - name: kvcache
                      mountPath: /kvcache
                  resources:
                    limits:
                      nvidia.com/gpu: 2
                  securityContext:
                    capabilities:
                      add:
                        - IPC_LOCK
              volumes:
                - name: model-vol
                  hostPath:
                    path: /data01/models
                    type: Directory
                - name: shared-mem
                  emptyDir:
                    medium: Memory
                # The KV shared store. Both prefill and decode must mount the SAME
                # backing directory — a node-local hostPath when co-located on one node,
                # or a shared volume (NFS / CSI RWX PVC) when spread across nodes.
                - name: kvcache
                  hostPath:
                    path: /data01/kvcache
                    type: Directory
        # ---------------------------------------------------------------------
        # Decode role — reads the prefill KV from the shared store (kv_consumer).
        # ---------------------------------------------------------------------
        - name: decode
          replicas: 1
          stateful: true
          template:
            metadata:
              labels:
                model.aibrix.ai/name: qwen3-32b
                model.aibrix.ai/port: "8000"
                model.aibrix.ai/engine: vllm
                role-name: decode
                roleset-name: group-0
            spec:
              containers:
                - name: decode
                  image: aibrix/vllm-openai:v0.10.2-aibrix-kvcache
                  command: ["sh", "-c"]
                  args:
                    - |
                      vllm serve \
                        --host "0.0.0.0" \
                        --port "8000" \
                        --model /models/Qwen3-32B \
                        --served-model-name qwen3-32b \
                        --trust-remote-code \
                        --swap-space "0" \
                        --no-enable-chunked-prefill \
                        --no-enable-prefix-caching \
                        --kv-transfer-config '{"kv_connector":"AIBrixPDReuseConnector","kv_role":"kv_consumer","engine_id":"decode_'${ROLE_REPLICA_INDEX}'"}' \
                        --tensor-parallel-size=2
                  env:
                    - name: VLLM_USE_V1
                      value: "1"
                    - name: AIBRIX_KV_CACHE_OL_L1_CACHE_ENABLED
                      value: "0"
                    - name: AIBRIX_KV_CACHE_OL_L2_CACHE_BACKEND
                      value: "SHFS"
                    - name: AIBRIX_KV_CACHE_OL_SHFS_ROOT
                      value: "/kvcache"
                    - name: AIBRIX_KV_CACHE_OL_L2_CACHE_NAMESPACE
                      value: "aibrix"
                    - name: AIBRIX_KV_CACHE_OL_TOKEN_VALIDATION_ENABLED
                      value: "0"
                  volumeMounts:
                    - name: model-vol
                      mountPath: /models
                      readOnly: true
                    - name: shared-mem
                      mountPath: /dev/shm
                    - name: kvcache
                      mountPath: /kvcache
                  resources:
                    limits:
                      nvidia.com/gpu: 2
                  securityContext:
                    capabilities:
                      add:
                        - IPC_LOCK
              volumes:
                - name: model-vol
                  hostPath:
                    path: /data01/models
                    type: Directory
                - name: shared-mem
                  emptyDir:
                    medium: Memory
                - name: kvcache
                  hostPath:
                    path: /data01/kvcache
                    type: Directory
